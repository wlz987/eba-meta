name: parity

on:
  push:
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wlz987/eba-py
          path: eba-py
      - uses: actions/checkout@v4
        with:
          repository: wlz987/eba-ts
          path: eba-ts
      - uses: actions/checkout@v4
        with:
          repository: wlz987/eba-rs
          path: eba-rs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 tools/examples.py
      - run: python3 tools/structure.py
      - run: python3 tools/api.py
      - run: python3 tools/duplicate.py
      - run: python3 tools/diff-examples.py
